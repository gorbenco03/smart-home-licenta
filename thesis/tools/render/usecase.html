<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#fff;font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;}
  [data-card]{background:#fff;padding:24px;width:1000px;}
  text{font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;}
</style></head>
<body>
<div data-card>
<svg viewBox="0 0 1000 660" width="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="uc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- system boundary -->
  <rect x="205" y="24" width="610" height="612" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="510" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#334155" letter-spacing="0.3">Sistem Smart Home</text>

  <!-- association lines (drawn first, under ellipses) -->
  <g stroke="#94a3b8" stroke-width="1.3">
    <!-- to left column (x edge 230) -->
    <line x1="118" y1="300" x2="232" y2="92"/>
    <line x1="118" y1="300" x2="232" y2="187"/>
    <line x1="118" y1="300" x2="232" y2="282"/>
    <line x1="118" y1="300" x2="232" y2="377"/>
    <line x1="118" y1="300" x2="232" y2="472"/>
    <line x1="118" y1="300" x2="232" y2="567"/>
    <!-- to right column rows 1-4 (x edge 532) -->
    <line x1="118" y1="300" x2="532" y2="92"/>
    <line x1="118" y1="300" x2="532" y2="187"/>
    <line x1="118" y1="300" x2="532" y2="282"/>
    <line x1="118" y1="300" x2="532" y2="377"/>
    <!-- Motor ML to Generare alerta -->
    <line x1="848" y1="567" x2="782" y2="567"/>
  </g>

  <!-- extend relations (dashed) -->
  <line x1="657" y1="440" x2="657" y2="411" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#uc)"/>
  <text x="666" y="430" font-size="11" fill="#7c3aed" font-style="italic">«extend»</text>
  <path d="M770,552 C 858,512 858,420 772,393" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#uc)"/>
  <text x="838" y="478" font-size="11" fill="#7c3aed" font-style="italic">«extend»</text>

  <!-- Utilizator actor -->
  <g stroke="#1f2937" stroke-width="1.8" fill="none">
    <circle cx="80" cy="252" r="15"/>
    <line x1="80" y1="267" x2="80" y2="322"/>
    <line x1="55" y1="289" x2="105" y2="289"/>
    <line x1="80" y1="322" x2="60" y2="358"/>
    <line x1="80" y1="322" x2="100" y2="358"/>
  </g>
  <text x="80" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Utilizator</text>

  <!-- Motor ML actor (system) -->
  <rect x="850" y="540" width="120" height="54" rx="7" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="910" y="562" text-anchor="middle" font-size="11" fill="#7c3aed" font-style="italic">«system»</text>
  <text x="910" y="580" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Motor ML</text>

  <!-- LEFT column ellipses -->
  <g>
    <ellipse cx="357" cy="92"  rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="357" y="97" text-anchor="middle" font-size="12.5" fill="#1e40af">Autentificare</text>

    <ellipse cx="357" cy="187" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="357" y="184" text-anchor="middle" font-size="12.5" fill="#1e40af">Vizualizare senzori</text>
    <text x="357" y="200" text-anchor="middle" font-size="12.5" fill="#1e40af">(dashboard)</text>

    <ellipse cx="357" cy="282" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="357" y="287" text-anchor="middle" font-size="12.5" fill="#1e40af">Vizualizare istoric</text>

    <ellipse cx="357" cy="377" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="357" y="382" text-anchor="middle" font-size="12.5" fill="#1e40af">Control LED-uri</text>

    <ellipse cx="357" cy="472" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="357" y="477" text-anchor="middle" font-size="12.5" fill="#1e40af">Control ventilator</text>

    <ellipse cx="357" cy="567" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="357" y="572" text-anchor="middle" font-size="12.5" fill="#1e40af">Control perdele (servo)</text>
  </g>

  <!-- RIGHT column ellipses -->
  <g>
    <ellipse cx="657" cy="92"  rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="657" y="89" text-anchor="middle" font-size="12.5" fill="#1e40af">Vizualizare flux cameră</text>
    <text x="657" y="105" text-anchor="middle" font-size="11.5" fill="#1d4ed8">(ESP32-CAM)</text>

    <ellipse cx="657" cy="187" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="657" y="184" text-anchor="middle" font-size="12.5" fill="#1e40af">Test buzzer /</text>
    <text x="657" y="200" text-anchor="middle" font-size="12.5" fill="#1e40af">Oprire totală</text>

    <ellipse cx="657" cy="282" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="657" y="279" text-anchor="middle" font-size="12.5" fill="#1e40af">Configurare Wi-Fi</text>
    <text x="657" y="295" text-anchor="middle" font-size="12.5" fill="#1e40af">(provisioning)</text>

    <ellipse cx="657" cy="377" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="657" y="382" text-anchor="middle" font-size="12.5" fill="#1e40af">Primire alerte</text>

    <ellipse cx="657" cy="472" rx="125" ry="30" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="657" y="477" text-anchor="middle" font-size="12.5" fill="#1e40af">Detectare gaz</text>

    <ellipse cx="657" cy="567" rx="125" ry="30" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="657" y="564" text-anchor="middle" font-size="12.5" fill="#991b1b">Generare alertă</text>
    <text x="657" y="580" text-anchor="middle" font-size="12.5" fill="#991b1b">anomalie (ML)</text>
  </g>
</svg>
</div>
</body></html>
