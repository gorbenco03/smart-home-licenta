version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smarthome_db
    environment:
      POSTGRES_DB: smarthome_db
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: smarthome123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
